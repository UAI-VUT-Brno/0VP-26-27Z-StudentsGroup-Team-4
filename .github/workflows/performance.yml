name: Performance

# Manual-only: performance tests are not part of the normal push/PR pipeline
# (see ci.yml, which explicitly excludes Category=Performance). They are
# heavier (many concurrent requests) and are run on demand, from any branch.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UAI.ZeroVP.sln

      - name: Build
        run: dotnet build UAI.ZeroVP.sln --configuration Release --no-restore

      - name: Test (performance tests only)
        run: >
          dotnet test UAI.ZeroVP.sln
          --configuration Release --no-build
          --filter "Category=Performance"
          --logger "trx;LogFileName=performance-test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: '**/performance-test-results.trx'
