# Reverzní proxy před replikami API (docker compose služba "api").
#
# Název "api" se překládá přes vestavěný DNS Dockeru (127.0.0.11) při každém požadavku (po
# uplynutí "valid"). Vrací adresy všech běžících replik, takže se nová nebo restartovaná replika
# objeví bez restartu nginx a požadavky se rozdělují mezi všechny repliky.

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;

    # Kontrola samotné brány (nezávislá na replikách).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # Proměnná v proxy_pass = překlad jména za běhu přes "resolver" výše.
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;

        # Ukáže, která replika požadavek obsloužila (kromě instanceId v /api/info).
        add_header X-Upstream-Addr $upstream_addr always;
    }
}